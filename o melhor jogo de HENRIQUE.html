
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON RUSH — Arcade</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#070816;color:white;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;display:flex;justify-content:center;
  align-items:center;overflow:hidden
}
#app{width:min(100%,480px);padding:12px}
header{text-align:center;margin-bottom:12px}
h1{margin:5px;font-size:34px;letter-spacing:5px;
color:#64faff;text-shadow:0 0 18px #00d9ff}
header p{margin:5px;color:#9da8d7;font-size:12px;letter-spacing:2px}
.stats{display:flex;justify-content:space-between;gap:8px;margin:12px 0}
.stat{background:#11142b;border:1px solid #282d54;
border-radius:12px;padding:10px;flex:1;text-align:center}
.stat small{display:block;color:#9299c7;font-size:10px;
letter-spacing:1px;margin-bottom:5px}
.stat strong{font-size:21px;color:#fff}
#gamebox{position:relative;border:1px solid #343b70;
border-radius:15px;overflow:hidden;box-shadow:0 0 35px #17165b;
background:#080a1b}
canvas{display:block;width:100%;height:auto;touch-action:none}
#overlay{position:absolute;inset:0;background:#08091bdc;
display:flex;align-items:center;justify-content:center;
text-align:center;padding:24px}
.panel{max-width:290px}
.panel h2{font-size:30px;color:#66faff;margin:0 0 12px;
text-shadow:0 0 16px #00cfff}
.panel p{font-size:14px;line-height:1.7;color:#c3c8e8}
button{border:0;border-radius:10px;padding:14px 22px;
font-weight:bold;cursor:pointer;font-size:15px}
#start{background:linear-gradient(100deg,#00e5ff,#a15bff);
color:#070816;width:100%;box-shadow:0 0 22px #00bfff55}
#start:active{transform:scale(.97)}
.hint{text-align:center;font-size:12px;color:#9299bd;line-height:1.8}
#controls{display:flex;justify-content:center;gap:22px;margin:10px 0}
.ctrl{width:65px;height:52px;background:#171a38;
color:#75faff;border:1px solid #353d73;font-size:23px;
touch-action:none;user-select:none}
footer{text-align:center;color:#525a85;font-size:10px;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>NEON RUSH</h1>
    <p>DESVIE • COLETE • SOBREVIVA</p>
  </header>

  <div class="stats">
    <div class="stat"><small>PONTOS</small><strong id="score">0</strong></div>
    <div class="stat"><small>CRISTAIS</small><strong id="coins">0</strong></div>
    <div class="stat"><small>RECORDE</small><strong id="best">0</strong></div>
  </div>

  <div id="gamebox">
    <canvas id="game" width="420" height="620"></canvas>
    <div id="overlay">
      <div class="panel">
        <h2 id="title">PRONTO?</h2>
        <p id="message">Desvie dos meteoros, pegue os cristais e sobreviva o máximo possível!</p>
        <button id="start">JOGAR AGORA ▶</button>
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="ctrl" id="left" aria-label="Mover para esquerda">◀</button>
    <button class="ctrl" id="right" aria-label="Mover para direita">▶</button>
  </div>
  <div class="hint">Use ← → ou A / D para mover<br>Também funciona no celular: toque nos controles.</div>
  <footer>NEON RUSH ARCADE • UM JOGO FEITO EM HTML</footer>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const W = canvas.width, H = canvas.height;

  let best = 0;
  try { best = Number(localStorage.getItem('neonRushBest')) || 0; }
  catch(e) {}
  $('best').textContent = best;

  let running = false, last = 0, elapsed = 0;
  let score = 0, coins = 0, speed = 210, spawn = 0;
  let obstacles = [], gems = [], particles = [], stars = [];
  let keys = {left:false,right:false};
  let player = {x:W/2,y:H-85,r:15};
  let shake = 0;

  for(let i=0;i<90;i++){
    stars.push({
      x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*1.7+.3,
      s:20+Math.random()*70
    });
  }

  function reset(){
    score=0;coins=0;elapsed=0;speed=210;spawn=0;
    obstacles=[];gems=[];particles=[];shake=0;
    player.x=W/2;player.y=H-85;
    updateStats();
  }

  function updateStats(){
    $('score').textContent=Math.floor(score);
    $('coins').textContent=coins;
    $('best').textContent=best;
  }

  function start(){
    reset();
    running=true;
    last=performance.now();
    $('overlay').style.display='none';
    requestAnimationFrame(loop);
  }

  function endGame(){
    running=false;
    const finalScore=Math.floor(score);
    const newRecord=finalScore>best;
    if(newRecord){
      best=finalScore;
      try{localStorage.setItem('neonRushBest',best)}catch(e){}
    }
    updateStats();
    $('title').textContent=newRecord?'NOVO RECORDE!':'FIM DE JOGO';
    $('message').innerHTML=
      'Pontuação: <b>'+finalScore+'</b><br>'+
      'Cristais coletados: <b>'+coins+'</b><br>'+
      (newRecord?'Você superou seu recorde! 🔥':'Tente novamente para bater seu recorde!');
    $('start').textContent='JOGAR NOVAMENTE ↻';
    $('overlay').style.display='flex';
  }

  function burst(x,y,color,n=12){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2;
      const v=40+Math.random()*220;
      particles.push({
        x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
        life:.35+Math.random()*.55,max:.9,
        r:2+Math.random()*3,color
      });
    }
  }

  function circleHit(a,b){
    const dx=a.x-b.x,dy=a.y-b.y;
    return Math.hypot(dx,dy)<a.r+b.r;
  }

  function loop(now){
    if(!running)return;
    const dt=Math.min((now-last)/1000,.035);
    last=now;
    update(dt);
    draw();
    if(running)requestAnimationFrame(loop);
  }

  function update(dt){
    elapsed+=dt;
    speed=210+Math.min(elapsed*5,260);
    score+=dt*(10+elapsed*.12);
    shake=Math.max(0,shake-dt*20);

    for(const s of stars){
      s.y+=s.s*dt*(speed/210);
      if(s.y>H){s.y=0;s.x=Math.random()*W;}
    }

    const move=(keys.right?1:0)-(keys.left?1:0);
    player.x+=move*310*dt;
    player.x=Math.max(player.r+5,Math.min(W-player.r-5,player.x));

    spawn-=dt;
    if(spawn<=0){
      spawn=Math.max(.25,.78-elapsed*.008);
      const r=12+Math.random()*17;
      obstacles.push({
        x:25+Math.random()*(W-50),y:-r,r,
        rot:Math.random()*6.28,spin:(Math.random()-.5)*3
      });

      if(Math.random()<.68){
        gems.push({
          x:25+Math.random()*(W-50),y:-15,r:9,
          phase:Math.random()*6
        });
      }
    }

    for(const o of obstacles){
      o.y+=speed*dt;
      o.rot+=o.spin*dt;
      if(circleHit(player,o)){
        burst(player.x,player.y,'#5dfaff',30);
        shake=10;
        endGame();
        break;
      }
    }

    obstacles=obstacles.filter(o=>o.y<H+50);

    for(let i=gems.length-1;i>=0;i--){
      const g=gems[i];
      g.y+=(speed*.85)*dt;
      g.phase+=dt*5;
      if(circleHit(player,g)){
        coins++;
        score+=50;
        burst(g.x,g.y,'#ffe66d',10);
        gems.splice(i,1);
      }else if(g.y>H+30){
        gems.splice(i,1);
      }
    }

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      p.vx*=.97;p.vy*=.97;p.life-=dt;
      if(p.life<=0)particles.splice(i,1);
    }
    updateStats();
  }

  function draw(){
    ctx.save();
    if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#080a20');
    bg.addColorStop(1,'#11102b');
    ctx.fillStyle=bg;
    ctx.fillRect(0,0,W,H);

    // Estrelas
    for(const s of stars){
      ctx.globalAlpha=.35+s.r*.3;
      ctx.fillStyle='#a8dfff';
      ctx.fillRect(s.x,s.y,s.r,s.r*2);
    }
    ctx.globalAlpha=1;

    // Grade futurista
    ctx.strokeStyle='#242758';
    ctx.lineWidth=.6;
    for(let x=0;x<W;x+=42){
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    }
    for(let y=(elapsed*speed*.45)%42;y<H;y+=42){
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }

    // Cristais
    for(const g of gems){
      ctx.save();
      ctx.translate(g.x,g.y);
      ctx.rotate(Math.PI/4+Math.sin(g.phase)*.18);
      ctx.shadowBlur=20;ctx.shadowColor='#ffe66d';
      ctx.fillStyle='#fff2a6';
      ctx.fillRect(-g.r*.7,-g.r*.7,g.r*1.4,g.r*1.4);
      ctx.fillStyle='#ffb72e';
      ctx.fillRect(-g.r*.35,-g.r*.35,g.r*.7,g.r*.7);
      ctx.restore();
    }

    // Meteoros
    for(const o of obstacles){
      ctx.save();
      ctx.translate(o.x,o.y);ctx.rotate(o.rot);
      ctx.shadowBlur=13;ctx.shadowColor='#ff416c';
      ctx.fillStyle='#ff416c';
      ctx.beginPath();
      for(let i=0;i<8;i++){
        const a=i*Math.PI/4;
        const rr=o.r*(i%2===0?1:.72);
        if(i===0)ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
        else ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
      }
      ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='#a91f55';
      ctx.beginPath();ctx.arc(-o.r*.2,-o.r*.1,o.r*.3,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }

    // Nave do jogador
    ctx.save();
    ctx.translate(player.x,player.y);
    ctx.shadowBlur=22;ctx.shadowColor='#00eaff';
    ctx.fillStyle='#65faff';
    ctx.beginPath();
    ctx.moveTo(0,-23);
    ctx.lineTo(17,15);
    ctx.lineTo(0,9);
    ctx.lineTo(-17,15);
    ctx.closePath();ctx.fill();

    ctx.fillStyle='#ffffff';
    ctx.beginPath();
    ctx.moveTo(0,-12);ctx.lineTo(5,5);ctx.lineTo(-5,5);
    ctx.closePath();ctx.fill();

    // Propulsores
    ctx.fillStyle='#a65bff';
    ctx.beginPath();
    ctx.moveTo(-6,12);ctx.lineTo(0,24+Math.random()*8);
    ctx.lineTo(6,12);ctx.closePath();ctx.fill();
    ctx.restore();

    // Partículas
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life/p.max);
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.restore();

    // Nível
    ctx.fillStyle='#a4addd';
    ctx.font='12px Arial';
    ctx.fillText('VELOCIDADE '+Math.floor(speed),12,22);
    ctx.fillStyle='#68faff';
    ctx.fillText('NÍVEL '+(1+Math.floor(elapsed/15)),W-83,22);
  }

  $('start').addEventListener('click',start);

  document.addEventListener('keydown',e=>{
    if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
    if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;
    if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;
    if(e.code==='Space'&&!running)start();
  });

  document.addEventListener('keyup',e=>{
    if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;
    if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false;
  });

  function bindButton(id,dir){
    const el=$(id);
    const on= e=>{e.preventDefault();keys[dir]=true;};
    const off=e=>{e.preventDefault();keys[dir]=false;};
    el.addEventListener('pointerdown',on);
    el.addEventListener('pointerup',off);
    el.addEventListener('pointerleave',off);
    el.addEventListener('pointercancel',off);
  }
  bindButton('left','left');
  bindButton('right','right');

  // Desenho inicial
  draw();
})();
</script>
</body>
</html>
